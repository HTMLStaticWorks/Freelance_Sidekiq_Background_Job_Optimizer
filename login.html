<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SidePulse Console</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            min-height: 100vh;
            padding: 5rem 1rem 2rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #081120 0%, #050816 100%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 3rem;
            position: relative;
        }
        .login-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-primary);
            filter: blur(80px);
            opacity: 0.1;
            z-index: -1;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            letter-spacing: 0.05em;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 0.5rem;
            color: var(--text-primary);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .password-wrap {
            position: relative;
        }
        .password-wrap .form-input {
            padding-right: 2.75rem;
        }
        .password-eye {
            position: absolute;
            right: 0.85rem;
            top: 0;
            bottom: 0;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0;
            width: 1.25rem;
            height: 1.25rem;
            margin: auto 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .password-eye:hover {
            color: var(--accent);
            transform: scale(1.08);
        }
        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            margin-top: 2rem;
        }
        .auth-top-controls {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.5rem;
            z-index: 10;
        }
        body.light-theme .auth-top-controls .btn-outline {
            color: #e2e8f0;
            border-color: rgba(148, 163, 184, 0.45);
            background: rgba(15, 23, 42, 0.35);
        }
        body.light-theme .auth-top-controls .btn-outline i {
            color: #e2e8f0;
        }
        
        .login-link:hover {
            color: var(--accent) !important;
        }
        .auth-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .auth-meta label,
        .auth-meta a {
            white-space: nowrap;
        }
        .forgot-link {
            transition: color 0.2s ease;
        }
        .forgot-link:hover {
            color: var(--accent) !important;
        }
        @media (max-width: 640px) {
            .auth-meta {
                gap: 0.5rem;
            }
            .auth-meta label,
            .auth-meta a {
                font-size: 0.75rem !important;
            }
        }
    </style>
</head>
<body>
    <div class="auth-top-controls">
        <button id="rtlToggle" class="btn btn-outline" style="height: 36px; padding: 0 1rem; font-size: 0.8rem;">RTL</button>
        <button id="themeToggle" class="btn btn-outline" style="width: 36px; height: 36px; padding: 0; font-size: 0.8rem;"><i class="fa-solid fa-moon"></i></button>
    </div>
    

    <div class="login-card glass-card">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
                <i class="fa-solid fa-bolt-lightning"></i> Side<span>Pulse</span>
            </a>
            <h2 style="font-size: 1.5rem;">Access Console</h2>
            <p class="text-secondary mono" style="font-size: 0.75rem;">SECURE_CONNECTION_STABLISHED</p>
        </div>

        <form action="dashboard.html">
            <div class="form-group">
                <label class="form-label">IDENTITY_EMAIL</label>
                <input type="email" class="form-input" placeholder="developer@org.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">ACCESS_KEY</label>
                <div class="password-wrap">
                    <input id="accessKeyInput" type="password" class="form-input" placeholder="********" required>
                    <button type="button" id="passwordEye" class="password-eye" aria-label="Show password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="auth-meta">
                <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--text-secondary); cursor: pointer;">
                    <input type="checkbox" style="accent-color: var(--accent);"> REMEMBER ME
                </label>
                <a href="#" class="text-secondary forgot-link" style="font-size: 0.8rem; text-decoration: none;">FORGOT PASSWORD?</a>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">AUTHENTICATE</button>
            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="signup.html" class="text-secondary login-link" style="font-size: 0.8rem; text-decoration: none; transition: color 0.3s ease;">NO_ACCOUNT? INITIALIZE_NEW</a>
            </div>
        </form>

        <div style="margin-top: 2rem; text-align: center;">
            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
                <div style="flex-grow: 1; height: 1px; background: var(--glass-border);"></div>
                <span class="mono" style="font-size: 0.7rem; color: var(--text-secondary);">FEDERATED_LOGIN</span>
                <div style="flex-grow: 1; height: 1px; background: var(--glass-border);"></div>
            </div>
            <div class="social-login">
                <a href="#" class="btn btn-outline" style="font-size: 0.75rem; padding: 0.6rem 0.2rem;"><i class="fa-brands fa-github" style="margin-right: 4px;"></i> GITHUB</a>
                <a href="#" class="btn btn-outline" style="font-size: 0.75rem; padding: 0.6rem 0.2rem;"><i class="fa-brands fa-google" style="margin-right: 4px;"></i> GOOGLE</a>
                <a href="#" class="btn btn-outline" style="font-size: 0.75rem; padding: 0.6rem 0.2rem;"><i class="fa-brands fa-apple" style="margin-right: 4px;"></i> APPLE</a>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        const accessKeyInput = document.getElementById('accessKeyInput');
        const passwordEye = document.getElementById('passwordEye');
        if (accessKeyInput && passwordEye) {
            passwordEye.addEventListener('click', () => {
                const isPassword = accessKeyInput.type === 'password';
                accessKeyInput.type = isPassword ? 'text' : 'password';
                passwordEye.innerHTML = isPassword
                    ? '<i class="fa-regular fa-eye-slash"></i>'
                    : '<i class="fa-regular fa-eye"></i>';
            });
        }
    </script>
    

</body>
</html>
