<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SidePulse Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            min-height: 100vh;
            padding: 5rem 1rem 2rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #081120 0%, #050816 100%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 3rem;
            position: relative;
        }
        .login-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-primary);
            filter: blur(80px);
            opacity: 0.1;
            z-index: -1;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 0.5rem;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            margin-top: 2rem;
        }
        
        .login-link:hover {
            color: var(--accent) !important;
        }
    </style>
</head>
<body>
    <div style="position: absolute; top: 1.5rem; right: 1.5rem; display: flex; gap: 0.5rem; z-index: 10;">
        <button id="rtlToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.8rem;">RTL</button>
        <button id="themeToggle" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.8rem;"><i class="fa-solid fa-moon"></i></button>
    </div>
    <div class="login-card glass-card">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
                <i class="fa-solid fa-bolt-lightning"></i> Side<span>Pulse</span>
            </a>
            <h2 style="font-size: 1.5rem;">Create Account</h2>
            <p class="text-secondary mono" style="font-size: 0.75rem;">INITIALIZE_NEW_CONNECTION</p>
        </div>

        <form action="dashboard.html">
            <div class="form-group">
                <label class="form-label">IDENTITY_EMAIL</label>
                <input type="email" class="form-input" placeholder="developer@org.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">ACCESS_KEY</label>
                <input type="password" class="form-input" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label class="form-label">VERIFY_KEY</label>
                <input type="password" class="form-input" placeholder="••••••••" required>
            </div>
            <div style="display: flex; justify-content: center; margin-bottom: 2rem;">
                <a href="login.html" class="text-secondary login-link" style="font-size: 0.8rem; text-decoration: none; transition: color 0.3s ease;">ALREADY_INITIALIZED? LOGIN</a>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">CREATE_ACCOUNT</button>
        </form>

        <div style="margin-top: 2rem; text-align: center;">
            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
                <div style="flex-grow: 1; height: 1px; background: var(--glass-border);"></div>
                <span class="mono" style="font-size: 0.7rem; color: var(--text-secondary);">FEDERATED_SIGNUP</span>
                <div style="flex-grow: 1; height: 1px; background: var(--glass-border);"></div>
            </div>
            <div class="social-login">
                <a href="#" class="btn btn-outline" style="font-size: 0.75rem; padding: 0.6rem 0.2rem;"><i class="fa-brands fa-github" style="margin-right: 4px;"></i> GITHUB</a>
                <a href="#" class="btn btn-outline" style="font-size: 0.75rem; padding: 0.6rem 0.2rem;"><i class="fa-brands fa-google" style="margin-right: 4px;"></i> GOOGLE</a>
                <a href="#" class="btn btn-outline" style="font-size: 0.75rem; padding: 0.6rem 0.2rem;"><i class="fa-brands fa-apple" style="margin-right: 4px;"></i> APPLE</a>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>

</body>
</html>
